services:
  kenv:
    build: .
    container_name: kenv-${HOST_USER}
    environment:
      - HOST_USER=${HOST_USER}
      - HOST_UID=${HOST_UID}
      - HOST_GID=${HOST_GID}
    ports:
      - "127.0.0.1:${SSH_PORT:-2222}:22"
    volumes:
      - .:/workspace
    stdin_open: true
    tty: true
    privileged: true  # Required for debootstrap, mount, loopback devices
    working_dir: /workspace
    labels:
      - "devcontainer.metadata=[{\"remoteUser\": \"kenv-${HOST_USER}\"}]"
